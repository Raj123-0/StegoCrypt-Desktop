[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegocrypt_desktop"
version = "1.0.0"
description = "Secure Steganography Desktop App. Combines AES-128 Encryption (via Fernet) with LSB Image Steganography."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raj123-0"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Raj123-0/StegoCrypt-Desktop"

[tool.setuptools]
py-modules = ['StegoCrypt, main']
